<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Class Guestbook</title>
  <meta name="description" content="Admin panel to review and remove messages in the Supabase class guestbook.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
</head>
<body>

  <header class="site-header">
    <a href="../../index.html" class="logo">Beyond the<span> Textbook</span></a>
    <a href="index.html" class="btn-back">&larr; Guestbook</a>
  </header>

  <main class="container">
    <p class="kicker">Supabase example &middot; Admin</p>
    <h1>Guestbook Admin</h1>
    <p class="intro">Sign in with the admin account to review messages and remove anything inappropriate.</p>

    <!--
      HOW THIS WORKS
      - This page is NOT secret. Anyone who finds the URL can open it.
      - What keeps it safe is Supabase Auth + Row Level Security (RLS):
        only someone who signs in with a real admin email/password
        (created by the teacher in the Supabase dashboard) can delete rows.
        Everyone else can only read and post, same as before.
    -->

    <!-- 1. Sign-in form (shown when nobody is logged in) -->
    <form id="login-form" class="panel">
      <label for="email">Admin email</label>
      <input type="email" id="email" placeholder="teacher@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <button type="submit" id="login-btn">Sign in</button>
      <p id="login-status" role="status"></p>
    </form>

    <!-- 2. Admin panel (shown after sign-in) -->
    <section id="admin-panel" class="panel hidden">
      <div class="admin-bar">
        <p id="who">Signed in</p>
        <button type="button" id="logout-btn">Sign out</button>
      </div>
      <h2>Messages <span id="count"></span></h2>
      <ul id="message-list">
        <li class="empty">Loading messages...</li>
      </ul>
    </section>
  </main>

  <!-- Load the Supabase library from a CDN (no installation needed) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Our own code -->
  <script src="admin.js"></script>
</body>
</html>
